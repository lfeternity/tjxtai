server:
  port: 8092  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:local}"
  application:
    name: promotion-service
tj:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.tianji.promotion.controller
    title: 智能在线教育系统 - 促销中心接口文档
    description: 该服务包含优惠促销有关的功能
    contact-name: lfeternity
    contact-url: https://github.com/lfeternity/tjxtai
    version: v1.0
  jdbc:
    database: tj_promotion
  auth:
    resource:
      enable: true # 开启登录拦截的功能
  mq:
    listener:
      retry:
        stateless: false # 无状态
  promotion:
    aes:
      key: tjxt-test-key-in
      iv: tjxt-test-ivinit
